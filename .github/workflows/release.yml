name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q -m "not live"

  build:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.14"
      - name: Verify tag matches package versions
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          RUNTIME_VERSION=$(python -c 'from rvw._version import __version__; print(__version__)')
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$RUNTIME_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match package=$PACKAGE_VERSION runtime=$RUNTIME_VERSION"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-image:
    name: Publish GHCR image
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python for version verification
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.14"

      - name: Verify and resolve image version
        id: version
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          RUNTIME_VERSION=$(python -c 'from rvw._version import __version__; print(__version__)')
          TAG_VERSION="${RELEASE_TAG#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ] || [ "$RUNTIME_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag $RELEASE_TAG does not match package=$PACKAGE_VERSION runtime=$RUNTIME_VERSION"
            exit 1
          fi
          printf 'version=%s\n' "$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/soju06/rvw:${{ env.RELEASE_TAG }}
            ghcr.io/soju06/rvw:latest
          build-args: |
            CODEX_BASE_URL=
            RVW_IMAGE_VERSION=${{ steps.version.outputs.version }}

      - name: Record published image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "$IMAGE_DIGEST"
          {
            echo "### Published container image"
            echo
            echo "- Version tag: \`ghcr.io/soju06/rvw:${RELEASE_TAG}\`"
            echo "- Mutable tag: \`ghcr.io/soju06/rvw:latest\`"
            echo "- Digest pin: \`ghcr.io/soju06/rvw@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Container image digest::ghcr.io/soju06/rvw@${IMAGE_DIGEST}"

  deploy-cloud:
    name: Provision Cloudflare resources and deploy Worker
    needs: gates
    if: vars.RVW_CLOUD_DEPLOY == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install cloud dependencies
        working-directory: cloud
        run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 — runner has no terraform binary
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false
      # A1 binds concrete Queue and R2 names, so infrastructure must exist
      # before Wrangler resolves and deploys those production bindings.
      - name: Apply Terraform resources
        working-directory: cloud/infra
        env:
          TF_VAR_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: terraform init -backend=false && terraform apply -auto-approve -var environment=prod
      - name: Deploy Worker (prod)
        working-directory: cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env prod

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rvw
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Create release or upload artifacts
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
