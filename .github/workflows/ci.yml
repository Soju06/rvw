name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync
        run: uv sync --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Lane scope lint
        run: uv run rvw lanes lint --scope

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run ty check

      - name: Tests (live excluded — needs codex credentials)
        run: uv run pytest -q -m "not live"
      - name: Check deployer neutrality
        run: python scripts/check-deployer-neutral.py

  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - name: Install cloud dependencies
        working-directory: cloud
        run: npm ci
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1 — runner has no terraform binary (CI exit 127, 2026-09-02)
        with:
          terraform_version: "1.15.6"
          terraform_wrapper: false
      - uses: astral-sh/setup-uv@v10.0.1 # uv build in the wheel-exclusion step (CI exit 127, 2026-09-02)
        with:
          python-version: "3.12"
      - name: Typecheck Worker
        working-directory: cloud
        run: npx tsc --noEmit
      - name: Test Worker logic
        working-directory: cloud
        run: npm test
      - name: Wrangler dry-run (spike)
        working-directory: cloud
        run: npx wrangler deploy --dry-run --outdir dist --env spike --var CODEX_PROXY_HOST:proxy.example --var GITHUB_APP_ID:1
      - name: Wrangler dry-run (prod)
        working-directory: cloud
        run: npx wrangler deploy --dry-run --outdir dist --env prod --var CODEX_PROXY_HOST:proxy.example --var GITHUB_APP_ID:1
      - name: Terraform validation
        working-directory: cloud/infra
        run: terraform fmt -check && terraform init -backend=false && terraform validate
      - name: Terraform deployer example validation
        working-directory: cloud/examples/deployer
        env:
          TF_VAR_cloudflare_api_token: placeholder
          TF_VAR_account_id: placeholder
          TF_VAR_environment: spike
        run: terraform fmt -check && terraform init -backend=false && terraform validate
      - name: Build cloud image from repository source
        run: docker build -f cloud/Dockerfile -t rvw-cloud-scaffold-check .
      - name: Verify Python distributions exclude cloud
        run: |
          uv build
          uv run --no-project python - <<'PY'
          import glob
          import tarfile
          import zipfile
          for path in glob.glob("dist/*"):
              names = (zipfile.ZipFile(path).namelist() if path.endswith(".whl") else tarfile.open(path).getnames())
              assert not any(name.startswith("cloud/") or "/cloud/" in name for name in names), path
          PY
