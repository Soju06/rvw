name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4; v5 silently no-ops the uv.lock toml updater
        with:
          # RELEASE_PLEASE_TOKEN is a required PAT for release tagging.
          # pushes trigger release.yml via the tag event. PyPI Trusted
          # Publishing rejects OIDC claims from reusable-caller chains, and
          # tags created by the default repository token never start
          # workflows, so neither alternative can publish.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

      # release-please's toml extra-file updater does not actually rewrite
      # uv.lock (observed on both v4 and v5, 2026-07-28; the pinned action worked
      # around it with manual 'chore(release): sync uv lock' commits every
      # release). Regenerate the lock on the release branch here instead.
      # The push must use the PAT: a default-repository-token push would not
      # retrigger the release PR's CI, leaving the PR with stale checks.
      - name: Check out release branch
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@v7
        with:
          ref: release-please--branches--main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - name: Sync uv.lock on the release branch
        if: steps.release.outputs.prs_created == 'true'
        uses: astral-sh/setup-uv@v10.0.1
      - name: Commit synced lockfile
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already in sync"
            exit 0
          fi
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore(release): sync uv lock for ${VERSION}"
          git push origin HEAD:release-please--branches--main
