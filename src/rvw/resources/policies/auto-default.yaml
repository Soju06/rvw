promote_to_blocker:
  agreement_at_least: 2
  severity_at_least: warning

drop:
  agreement_at_most: 1
  severity_at_most: suggestion

block_when:
  severity_at_least: blocker
  confirmed_only: true

publish_state: comment

# Consumers select automatic actions and name their own review exclusions.
triggers:
  events:
    pull_request:
      enabled: true
      actions: [opened, synchronize, reopened, ready_for_review]
    mention:
      enabled: true
      surfaces: [issue_comment, pull_request_review_comment]
      allow: [OWNER, MEMBER, COLLABORATOR]
  dedupe_same_head: true
  mode: denylist
  drafts: skip
  rules: []

# Review event per verdict. Defaults reproduce COMMENT-only publication; a
# consuming repository opts into stronger events in its own base-ref copy.
publish:
  channels: [checks, review]
  checks:
    on_block: failure
    on_pass: success
  inline:
    severity_at_least: suggestion
    max_comments: null
  on_block: comment
  on_pass: comment
  dismiss_on_pass: false
  approve_requires_explicit_opt_in: true

# rvw's own inline threads: resolve when the finding is gone on the next head,
# never post a second thread for a finding that already has an open one.
threads:
  resolve_on_fix: true
  reuse_open_thread: true
