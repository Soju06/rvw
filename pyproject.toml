[project]
name = "rvw"
version = "0.5.0"
description = "Layered, replicated, self-adjudicating code review orchestrator"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Soju06" }]
requires-python = ">=3.12"
keywords = ["cli", "code-review", "llm", "orchestrator", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.27.0",
    "rich>=15.0.0",
    "pydantic>=2.13.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "ty>=0.0.63",
    "pre-commit>=4.6.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
# IMPORTANT: target the Typer app object, not a main() function.
rvw = "rvw.cli:app"

[project.urls]
Repository = "https://github.com/Soju06/rvw"
Issues = "https://github.com/Soju06/rvw/issues"
Changelog = "https://github.com/Soju06/rvw/releases"

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".hermes"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: requires a real codex CLI invocation (deselect with -m 'not live')",
]
